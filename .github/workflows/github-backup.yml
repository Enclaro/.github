---
name: GitHub backup

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

concurrency:
  group: github-gcs-backup
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

env:
  GCP_PROJECT_ID: gen-lang-client-0123391680
  GCS_BUCKET: zasobnik-tr
  WIF_PROVIDER: projects/833314992090/locations/global/workloadIdentityPools/github-actions/providers/twojstar-backup
  MAX_BACKUP_BYTES: "2147483648"
  MAX_BILLABLE_BYTES: "4294967296"
  FILTERED_REPOSITORY: trvny/feedseek
  FILTERED_PATHS: "cache feeds feedseek/cache feedseek/feeds"

jobs:
  backup:
    name: Back up GitHub repositories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check GPTomek authentication
        id: auth
        shell: bash
        env:
          GPTOMEK_APP_CLIENT_ID: ${{ vars.GPTOMEK_APP_CLIENT_ID }}
          GPTOMEK_APP_PRIVATE_KEY: ${{ secrets.GPTOMEK_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$GPTOMEK_APP_CLIENT_ID" && -n "$GPTOMEK_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GPTomek private key is unavailable; backing up public repositories only."
          fi

      - name: Create trvny read token
        if: steps.auth.outputs.configured == 'true'
        id: trvny-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GPTOMEK_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPTOMEK_APP_PRIVATE_KEY }}
          owner: trvny
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Create travnie read token
        if: steps.auth.outputs.configured == 'true'
        id: org-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GPTOMEK_APP_CLIENT_ID }}
          private-key: ${{ secrets.GPTOMEK_APP_PRIVATE_KEY }}
          owner: travnie
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Ensure Git LFS is available
        shell: bash
        run: |
          if ! git lfs version; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi

      - name: Ensure git-filter-repo is available
        shell: bash
        run: |
          if ! git filter-repo --version >/dev/null 2>&1; then
            python3 -m pip install --user git-filter-repo==2.47.0
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Build repository archives
        shell: bash
        env:
          TRVNY_TOKEN: ${{ steps.trvny-token.outputs.token }}
          ORG_TOKEN: ${{ steps.org-token.outputs.token }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          bash --noprofile --norc -e -o pipefail .github/scripts/github-backup-build.sh
      - name: Guard single backup size
        shell: bash
        run: |
          bytes="$(du -sb backup/github | cut -f1)"
          if (( bytes > MAX_BACKUP_BYTES )); then
            echo "::error::Backup is ${bytes} bytes; refusing to exceed the 2 GiB safety cap."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify backup bucket policy
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail .github/scripts/github-backup-verify-bucket.sh
      - name: Merge retained fallback metadata
        if: steps.auth.outputs.configured != 'true'
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail .github/scripts/github-backup-retained.sh
      - name: Guard billed storage headroom
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail .github/scripts/github-backup-storage-guard.sh
      - name: Sync backup to Cloud Storage
        shell: bash
        env:
          FULL_BACKUP: ${{ steps.auth.outputs.configured }}
        run: |
          if [[ "$FULL_BACKUP" == "true" ]]; then
            gcloud storage rsync backup/github "gs://${GCS_BUCKET}/github" \
              --recursive \
              --delete-unmatched-destination-objects
          else
            echo "::notice::Public fallback is non-destructive; existing private archives are preserved."
            gcloud storage rsync backup/github "gs://${GCS_BUCKET}/github" --recursive
          fi


      - name: Verify live backup catalog
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail .github/scripts/github-backup-verify-catalog.sh
      - name: Summarize backup
        shell: bash
        run: |
          files="$(find backup/github -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb backup/github | cut -f1)"
          {
            echo '## GitHub backup'
            echo
            echo "Files: $files"
            echo
            echo "Bytes: $bytes"
            echo
            echo "Destination: gs://${GCS_BUCKET}/github/"
            echo
            if [[ -n "$FILTERED_REPOSITORY" ]]; then
              echo "Filtered Git: ${FILTERED_REPOSITORY} (${FILTERED_PATHS})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
